name: scytal

services:
  web:
    build:
      context: .
      target: runtime
    image: scytal-frontend:latest
    ports:
      - "${SCYTAL_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dev:
    build:
      context: .
      target: deps
    image: scytal-frontend-dev:latest
    command: pnpm exec vite --host 0.0.0.0 --port 5173 --strictPort
    environment:
      VITE_DOCKER: "1"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    ports:
      - "${SCYTAL_DEV_PORT:-5173}:5173"
    profiles: ["dev"]
