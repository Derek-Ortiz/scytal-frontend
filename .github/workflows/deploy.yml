name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un solo run por rama: en PR se cancelan los obsoletos; en main nunca se
# cancela un despliegue a medias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build y publicación de la imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Auditoría informativa: no debe tumbar el pipeline si hay CVEs abiertos.
      - name: Auditar dependencias de producción
        run: pnpm audit --prod
        continue-on-error: true

      # ghcr exige minúsculas: ghcr.io/owner/repo
      - name: Calcular nombre de imagen
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (y push solo en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://${{ vars.DOMAIN }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue en EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FRONT_HOST: ${{ secrets.FRONT_HOST }}
    steps:
      - name: Checkout (ficheros de deploy/)
        uses: actions/checkout@v4

      # La clave nunca se imprime: viaja por variable de entorno al fichero.
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$FRONT_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Subir compose y Caddyfile
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml "$FRONT_HOST:/opt/scytal/docker-compose.yml"
          scp -o StrictHostKeyChecking=accept-new \
            deploy/Caddyfile "$FRONT_HOST:/opt/scytal/Caddyfile"

      - name: Actualizar imagen y reiniciar servicios
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"
          ssh "$FRONT_HOST" "cd /opt/scytal && sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/${IMAGE}:sha-${GITHUB_SHA}|' .env && docker compose pull web && docker compose up -d && docker image prune -f"
