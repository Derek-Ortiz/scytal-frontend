name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un solo run por rama: en PR se cancelan los obsoletos; en main nunca se
# cancela un despliegue a medias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build y publicación de la imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Auditoría informativa: no debe tumbar el pipeline si hay CVEs abiertos.
      - name: Auditar dependencias de producción
        run: pnpm audit --prod
        continue-on-error: true

      # ghcr exige minúsculas: ghcr.io/owner/repo
      - name: Calcular nombre de imagen
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (y push solo en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://${{ vars.DOMAIN }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue en EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      FRONT_HOST: ${{ secrets.FRONT_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
    steps:
      - name: Checkout (ficheros de deploy/)
        uses: actions/checkout@v7

      - name: Validar configuración de despliegue
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          test -n "$FRONT_HOST" || { echo "::error::Configura el secreto FRONT_HOST."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Configura el secreto SSH_PRIVATE_KEY."; exit 1; }
          test -n "$DOMAIN" || { echo "::error::Configura la variable DOMAIN."; exit 1; }

      # La clave nunca se imprime: viaja por variable de entorno al fichero.
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ "$FRONT_HOST" == *@* ]]; then
            FRONT_TARGET="$FRONT_HOST"
            SCAN_HOST="${FRONT_HOST#*@}"
          else
            FRONT_TARGET="${SSH_USER}@${FRONT_HOST}"
            SCAN_HOST="$FRONT_HOST"
          fi
          echo "FRONT_TARGET=$FRONT_TARGET" >> "$GITHUB_ENV"
          ssh-keyscan -H "$SCAN_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Subir compose y Caddyfile
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            "$FRONT_TARGET" "sudo mkdir -p /opt/scytal &&
             sudo chown -R \$(id -u):\$(id -g) /opt/scytal"
          scp -o BatchMode=yes -o IdentitiesOnly=yes \
            deploy/docker-compose.prod.yml "${FRONT_TARGET}:/opt/scytal/docker-compose.yml"
          scp -o BatchMode=yes -o IdentitiesOnly=yes \
            deploy/Caddyfile "${FRONT_TARGET}:/opt/scytal/Caddyfile"

      - name: Actualizar imagen y reiniciar servicios
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GITHUB_TOKEN" | ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            "$FRONT_TARGET" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$FRONT_TARGET" \
            "cd /opt/scytal && sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=$IMAGE|' .env &&
             docker compose pull web &&
             docker compose up -d &&
             docker logout ghcr.io &&
             docker image prune -f"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
