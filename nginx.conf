# Configuración del servidor nginx para servir el build estático de Scytal.
# Se monta como /etc/nginx/conf.d/default.conf en la etapa `runtime` del Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para contenido de texto
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad aplicadas a todas las respuestas.
    # Nota: si un `location` declara sus propias directivas add_header,
    # ya NO hereda estas (comportamiento de nginx), por eso se repiten
    # dentro de /assets/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Assets con hash en el nombre (generados por Vite): cache agresiva.
    # Ojo: al declarar add_header aquí hay que repetir las cabeceras de seguridad.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # index.html sin cache (las rutas cacheadas llevan hash en el nombre):
    # `expires` no interfiere con la herencia de add_header.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Resto: ficheros reales y fallback SPA para rutas...
    # (la app navega por estado, pero esto evita 404 en recargas)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
